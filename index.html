<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Ma To-Do List</h1>
            <p class="subtitle">Organisez vos tâches facilement</p>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                class="task-input" 
                placeholder="Ajouter une nouvelle tâche..."
                autocomplete="off"
            >
            <button id="addBtn" class="add-btn">Ajouter</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">Toutes</button>
            <button class="filter-btn" data-filter="active">Actives</button>
            <button class="filter-btn" data-filter="completed">Complétées</button>
        </div>

        <div class="stats">
            <span id="taskCount">0 tâche</span>
            <span id="completedCount">0 complétée</span>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="empty-state" id="emptyState">
            <p>🎉 Aucune tâche! Vous êtes à jour!</p>
        </div>

        <div class="action-section">
            <button id="clearBtn" class="clear-btn">Supprimer les complétées</button>
            <button id="deleteAllBtn" class="delete-all-btn">Tout supprimer</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
